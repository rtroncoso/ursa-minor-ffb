[package]
name = "aurora_vibra"
version = "5.0.0"
edition = "2024"
# edition 2024 требует 1.85, let-chains в src/updater.rs — 1.88.
rust-version = "1.88"
build = "src/build.rs"
default-run = "aurora-vibra"  # Оставляем основное приложение
description = "Tactile feedback (force feedback / rumble) and telemetry utility for Microsoft Flight Simulator, X-Plane 12 and War Thunder"
authors = ["chegevarko1982"]
repository = "https://github.com/chegevarko1982/aurora-vibra"
license = "MIT"
readme = "README.md"
# Бинари из src/bin/ перечислены явно ниже (все под фичей dev-tools) —
# автообнаружение подцепило бы их без required-features.
autobins = false

# lib/SimConnect.dll — проприетарный компонент Microsoft (см. THIRD-PARTY-NOTICES.md),
# его не должно быть в публикуемом архиве крейта. TXT/ — устаревшие копии исходников.
exclude = ["lib/", "TXT/", "dist/"]

[lints.clippy]
# Каждый unsafe-блок обязан иметь SAFETY-комментарий с обоснованием
# инвариантов (валидность хендлов, время жизни буферов, владение). "warn"
# здесь достаточно: CI гоняет clippy с -D warnings, так что пропущенный
# комментарий всё равно роняет сборку.
undocumented_unsafe_blocks = "warn"

[lib]
name = "aurora_vibra"
path = "src/lib.rs"

[[bin]]
name = "aurora-vibra"
path = "src/main.rs"
required-features = ["app"]

# Диагностические утилиты из src/bin/: ручные стенды для железа (перебор
# режимов вибромоторов, замеры HID-фреймов, пробы SimConnect). В релиз не
# входят и в CI не нужны, поэтому спрятаны за отдельной фичей — иначе
# `cargo build --release --features app` собирал бы их все, включая
# test_motor_gui на eframe (~7 МБ).
#
#     cargo run --features dev-tools --bin test_motor_gui
[[bin]]
name = "engine_start_probe"
path = "src/bin/engine_start_probe.rs"
required-features = ["dev-tools"]

[[bin]]
name = "ramp_test"
path = "src/bin/ramp_test.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_gear"
path = "src/bin/test_gear.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_gun1"
path = "src/bin/test_gun1.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_hold"
path = "src/bin/test_hold.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_motor_gui"
path = "src/bin/test_motor_gui.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_spoilers"
path = "src/bin/test_spoilers.rs"
required-features = ["dev-tools"]

# Гоняет реальный wt_link::rumble::WtRumbleState (не переизобретает формулы)
# по скриптованному профилю AoA — поэтому тянет "app" (там живут
# aero_profiles/rumble/vars), а не только "dev-tools".
[[bin]]
name = "test_stall"
path = "src/bin/test_stall.rs"
required-features = ["dev-tools", "app"]

# Гоняет реальный wt_link::rumble::WtRumbleState по скриптованному профилю
# RPM 1, воспроизводящему живой лог пуск/останов — та же причина, что и у
# test_stall, тянет "app".
[[bin]]
name = "test_engine_start"
path = "src/bin/test_engine_start.rs"
required-features = ["dev-tools", "app"]

[[bin]]
name = "test_throttle_stutter"
path = "src/bin/test_throttle_stutter.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_throttle_stutter_gui"
path = "src/bin/test_throttle_stutter_gui.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_touchdown"
path = "src/bin/test_touchdown.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_vibro"
path = "src/bin/test_vibro.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_vibroTH"
path = "src/bin/test_vibroTH.rs"
required-features = ["dev-tools"]

# Стенд «математически выверенный ровный паттерн»: пишет в устройство напрямую
# по абсолютным дедлайнам, минуя движок эффектов, egui и телеметрию, и печатает
# фактическое отклонение сетки отправок от идеала. Нужен, чтобы отличить
# неравномерность тракта от инерции самих вибромоторов.
[[bin]]
name = "test_pattern_uniformity"
path = "src/bin/test_pattern_uniformity.rs"
required-features = ["dev-tools"]

# Автономная разведывательная утилита для War Thunder HTTP-телеметрии
# (localhost:8111/state, /indicators, /hudmsg, ...). Кроссплатформенная
# (Windows + Linux, в т.ч. --replay в CI без запущенной игры), поэтому не под
# cfg(windows) и не в dev-tools — отдельная фича, чтобы не тянуть её зависимости
# (clap/ctrlc) в обычную сборку app.
[[bin]]
name = "wt_probe"
path = "src/bin/wt_probe/main.rs"
required-features = ["wt-probe"]

# То же самое (общий код в src/wt_probe/), но вывод в окно eframe/egui вместо
# консоли. Windows-only: egui/eframe объявлены только в
# [target.'cfg(windows)'.dependencies] ниже (см. комментарий там), поэтому вся
# начинка лежит в gui.rs под cfg(windows), а main.rs на прочих платформах
# собирается в заглушку с сообщением. Без этой заглушки Linux-CI падал: шаг
# `cargo clippy --bin wt_probe --features wt-probe --tests` из-за --tests
# собирает тест-таргеты всех бинарников, подходящих по required-features.
[[bin]]
name = "wt_probe_gui"
path = "src/bin/wt_probe_gui/main.rs"
required-features = ["wt-probe"]

[features]
default = []
app = ["dep:reqwest"]
# Ручные диагностические стенды из src/bin/ — см. секции [[bin]] выше.
dev-tools = []
wt-probe = ["dep:reqwest", "dep:clap", "dep:ctrlc"]

[dependencies]
crossbeam-channel = "0.5"
parking_lot = "0.12"
chrono = "0.4"
# Не в cfg(windows): settings.rs / types.rs / i18n.rs / aircraft_profiles.rs —
# кроссплатформенные модули, и они сериализуются. Пока serde жил в
# Windows-секции, `cargo check` на Linux падал с unresolved import.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# reqwest живёт здесь (не в windows-секции), потому что wt_probe (см. feature
# "wt-probe" ниже) должен собираться и работать на Linux — там нет игры, но
# --replay гоняет записанные сессии в CI. updater.rs (windows+app) использует
# тот же клиент. default-features = false обязательно: иначе reqwest тянет
# ещё и default-tls (native-tls → hyper-tls → schannel) поверх запрошенного
# rustls, то есть два TLS-стека в бинаре вместо одного.
#
# 0.12, а не 0.11: 0.11 тянет rustls 0.21 → rustls-webpki 0.101.7, на которую
# висят RUSTSEC-2026-0098/-0099 (name constraints принимались там, где не
# должны) и -0104 (паника при разборе CRL), плюс неподдерживаемый
# rustls-pemfile 1.x.
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
], optional = true }
# CLI-парсинг для wt_probe.
clap = { version = "4", features = ["derive"], optional = true }
# Корректное завершение wt_probe по Ctrl+C (дописать буферы, напечатать отчёт)
# кроссплатформенно — на Windows и на Linux (CI --replay).
ctrlc = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
# GUI
# default-features pulls in the "wgpu" renderer, whose DX12 backend (wgpu-hal)
# depends on windows-core 0.62.x — conflicting with our own `windows = "0.56"`
# pin used throughout hid/sim/tray (two incompatible copies of the same trait
# in the dependency graph). We don't use accesskit/persistence, so stick to
# the glow (OpenGL) renderer instead, sidestepping the conflict entirely.
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.35"
egui_extras = { version = "0.35", features = ["image"] }

# HID
hidapi = "2.6"

# DLL loader for SimConnect
libloading = "0.8"

# utils
anyhow = "1.0"
thiserror = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# Проверка SHA-256 скачанного обновления против опубликованного SHA256SUMS.txt
# (см. src/updater.rs) — этот путь кода при необходимости поднимает права
# через UAC, так что архив обязан быть проверен до распаковки.
sha2 = "0.10"

# Win32 API
once_cell = "1.19"
widestring = "1.0"
windows = { version = "0.56", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_System_Threading",
  # GetOpenFileNameW/GetSaveFileNameW (comdlg32) для file_dialog.rs — родная
  # замена rfd, которого в проекте нет и добавлять нельзя.
  "Win32_UI_Controls_Dialogs"
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2.4"

[dev-dependencies]
mockall = "0.13"
approx = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
